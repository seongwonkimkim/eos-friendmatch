<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>EOS HobbyMatch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: 학교 이름표 콘셉트 — 한 문제씩 넘기는 질문 카드 → 결과(내 이름표 + 추천 이름표) */
:root{
  --bg:#eef2f4; --paper:#ffffff; --ink:#17232b; --muted:#5b6b75; --line:#d5dde2;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dbe9f3;
  --tag:#f2c94c; --tag-ink:#3a2c00; --bad:#b4483a; --heart:#e0245e;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","PingFang SC","Hiragino Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10181d; --paper:#18232a; --ink:#e6edf1; --muted:#9aabb5; --line:#2a3a44;
  --accent:#6fb1de; --accent-ink:#0c1a23; --accent-soft:#1d3444;
  --tag:#e0b83e; --tag-ink:#231a00; --bad:#e88a7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --paper:#18232a; --ink:#e6edf1; --muted:#9aabb5; --line:#2a3a44;
  --accent:#6fb1de; --accent-ink:#0c1a23; --accent-soft:#1d3444;
  --tag:#e0b83e; --tag-ink:#231a00; --bad:#e88a7c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,44px);margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted)}
.langsel{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
input[type=text],input[type=date],input[type=password],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:16px}

.quiz{max-width:640px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.qtop{background:var(--accent);color:var(--accent-ink);padding:12px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.qtop b{font-family:var(--display);font-weight:400;font-size:20px}
.qtop span{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--tag);transition:width .3s}
.qbody{padding:24px 18px 20px;display:flex;flex-direction:column;gap:16px;min-height:280px}
.qbody h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.5vw,34px);line-height:1.2;margin:0;text-wrap:balance}
.qbody .sub{color:var(--muted);margin:-8px 0 0}
.namerow{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 14px;cursor:pointer;transition:background .12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qnav{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.qnav .grow{flex:1}
.btn{font:inherit;font-size:14px;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.review{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.review button{font:inherit;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer;color:var(--ink);display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.review button:last-child{border-bottom:none}
.review button:hover{background:var(--bg)}
.review .k{font-size:13px;color:var(--muted)}
.review .v.empty{color:var(--muted)}
.warn{color:var(--bad);font-size:13px;margin:0}

.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
h2.sec{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.mytag{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mytag .band{background:var(--accent);color:var(--accent-ink);padding:8px 16px;font-family:var(--display);font-size:18px}
.mytag .inner{padding:16px;display:flex;flex-direction:column;gap:12px}
.nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
.gpill{font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 8px;white-space:nowrap}
.minichips{display:flex;flex-wrap:wrap;gap:4px}
.minichips span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{font-size:13px;padding:6px 11px}
.btn.danger{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.card .hole{position:absolute;top:10px;left:50%;width:34px;height:7px;margin-left:-17px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.card .top{padding:26px 16px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.avatar{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:22px;flex:none;background:var(--accent-soft);color:var(--accent)}
.who{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.who .nm b{font-family:var(--body);font-weight:700;font-size:17px}
.exb{font-size:11px;color:var(--muted);border:1px dashed var(--muted);border-radius:5px;padding:0 6px;width:max-content}
.meter{text-align:right;flex:none}
.meter .pct{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.meter .lv{font-size:11px;color:var(--muted)}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 0 auto;width:72px}
.bar i{display:block;height:100%;background:var(--accent)}
.card .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.shared{display:flex;flex-wrap:wrap;gap:5px}
.stag{font-size:12px;background:var(--tag);color:var(--tag-ink);border-radius:5px;padding:2px 8px;font-weight:500}
.starter{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.starter q{quotes:none;flex:1 1 160px}
.mini{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:3px 8px;cursor:pointer;flex:none}
.locked{background:var(--paper);border:1px dashed var(--muted);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.locked h3{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hright{display:flex;gap:8px;align-items:center;position:relative}
.mailbtn{position:relative;width:42px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.mailbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--heart);color:#fff;font:700 11px/20px var(--mono);text-align:center;padding:0 5px;border:2px solid var(--bg)}
.inbox{position:absolute;top:calc(100% + 8px);right:0;width:min(340px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:6;overflow:hidden}
.inbox .ih{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
.inbox ul{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto}
.inbox li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.inbox li:last-child{border-bottom:none}
.inbox li.new{background:var(--accent-soft)}
.inbox li .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--heart)}
.inbox li .ic svg{width:16px;height:16px}
.inbox li q{quotes:none;display:block;color:var(--muted);font-size:13px}
.inbox .empty{padding:20px 14px;color:var(--muted);font-size:14px;text-align:center}
.social{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding:10px 16px 0;margin:0 -16px}
.heartbtn,.replybtn{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer}
.heartbtn svg,.replybtn svg{width:17px;height:17px}
.heartbtn.on{color:var(--heart);border-color:var(--heart)}
.heartbtn.on svg path{fill:var(--heart)}
.heartbtn.pop svg{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font:inherit;font-size:13px;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:99px;padding:4px 10px;cursor:pointer}
.presets button.on{background:var(--accent);color:var(--accent-ink)}
.replies{display:flex;flex-direction:column;gap:4px;font-size:13px}
.replies b{font-weight:700;margin-right:5px}
.recv{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
@media (max-width:480px){.namerow{grid-template-columns:minmax(0,1fr) 104px}.review button{grid-template-columns:84px minmax(0,1fr)}}
/* ===== 꾸미기: 목걸이 이름표 + 모눈 배경 ===== */
:root{--dot:#cfd9df;--strap:#1f5f8b;--clip:#b8c2c8;--av0:#ffd8a8;--av0i:#8a4b00;--av1:#c3f0d8;--av1i:#1d6b43;--av2:#d6dcff;--av2i:#33408f;--av3:#ffd3e1;--av3i:#9a2350;--av4:#d2f1f7;--av4i:#1b6474;--av5:#f1e3b5;--av5i:#6e5a12;--shadow:0 1px 2px rgba(23,35,43,.06),0 8px 24px rgba(23,35,43,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dot:#1e2b33;--strap:#6fb1de;--clip:#5d6a72;--av0:#4a3418;--av0i:#ffc98a;--av1:#173d2b;--av1i:#8fe3b7;--av2:#262e5c;--av2i:#b9c3ff;--av3:#4b1d2e;--av3i:#ffb3cb;--av4:#173c45;--av4i:#9fe3f0;--av5:#40371a;--av5i:#ecd88f;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--dot:#1e2b33;--strap:#6fb1de;--clip:#5d6a72;--av0:#4a3418;--av0i:#ffc98a;--av1:#173d2b;--av1i:#8fe3b7;--av2:#262e5c;--av2i:#b9c3ff;--av3:#4b1d2e;--av3i:#ffb3cb;--av4:#173c45;--av4i:#9fe3f0;--av5:#40371a;--av5i:#ecd88f;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px}
header{border-bottom:none;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--ink) 0 18px,transparent 18px 26px)}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:52px;height:52px;flex:none}
.brand h1 span{position:relative}
.brand h1 span::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:.32em;background:var(--tag);opacity:.55;z-index:-1;border-radius:3px}
.brand h1{position:relative;z-index:0}

/* 목걸이 끈 + 클립 */
.lanyard{position:relative;margin-top:46px}
.lanyard::before{content:"";position:absolute;left:50%;top:-46px;width:22px;height:38px;margin-left:-11px;background:repeating-linear-gradient(180deg,var(--accent) 0 6px,color-mix(in srgb,var(--accent) 80%,var(--paper)) 6px 8px);border-radius:3px 3px 0 0}
.lanyard::after{content:"";position:absolute;left:50%;top:-12px;width:40px;height:20px;margin-left:-20px;background:var(--clip);border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);z-index:2}
.quiz{overflow:visible;box-shadow:var(--shadow);border-radius:18px}
.qtop{border-radius:18px 18px 0 0;padding-top:16px}
.mytag{overflow:visible;box-shadow:var(--shadow)}
.mytag .band{border-radius:14px 14px 0 0;padding-top:14px;display:flex;justify-content:space-between;align-items:center}
.mytag .band small{font-family:var(--mono);font-size:11px;opacity:.8;letter-spacing:.08em}

/* 진행 칸 */
.segs{display:flex;gap:5px;padding:12px 18px 0}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--line);transition:background .25s}
.segs i.done{background:var(--tag)}
.segs i.cur{background:var(--accent)}
.segs i.cur.done{background:linear-gradient(90deg,var(--accent) 50%,var(--tag) 50%)}
.qhead{display:flex;gap:14px;align-items:flex-start}
.qnum{font-family:var(--mono);font-size:15px;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 9px;line-height:1;flex:none;margin-top:6px}
.qhead>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.qhead .sub{margin:0}
.qbody{animation:slidein .3s ease-out}
@keyframes slidein{from{transform:translateX(14px);opacity:.4}to{transform:none;opacity:1}}

/* 선택지 */
.chip{background:var(--paper);box-shadow:0 1px 0 var(--line);transition:transform .12s,background .12s,box-shadow .12s}
.chip:hover{transform:translateY(-2px);box-shadow:0 3px 0 var(--line)}
.chip.on{box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,var(--ink))}
.chip.on::before{content:"✓";margin-right:5px;font-weight:700}
.btn.primary{box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,var(--ink));transition:transform .1s,box-shadow .1s}
.btn.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,var(--ink))}

/* 추천 카드 */
.card{box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;animation:rise .4s ease-out backwards}
.card:hover{transform:translateY(-3px) rotate(-.3deg)}
.cards .card:nth-child(2){animation-delay:.05s}.cards .card:nth-child(3){animation-delay:.1s}.cards .card:nth-child(4){animation-delay:.15s}.cards .card:nth-child(5){animation-delay:.2s}.cards .card:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.card .top{background:linear-gradient(180deg,var(--accent-soft),transparent)}
.av0{background:var(--av0);color:var(--av0i)}.av1{background:var(--av1);color:var(--av1i)}.av2{background:var(--av2);color:var(--av2i)}.av3{background:var(--av3);color:var(--av3i)}.av4{background:var(--av4);color:var(--av4i)}.av5{background:var(--av5);color:var(--av5i)}
.avatar{border-radius:50%;width:50px;height:50px;font-size:24px;box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--line)}
.ring{width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin-left:auto}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.meter .lv{margin-top:4px;text-align:center}
.stag{background:linear-gradient(transparent 35%,var(--tag) 35%);color:var(--ink);padding:0 3px;border-radius:2px;font-size:13px}
.starter{border-left:3px solid var(--accent);border-radius:4px 10px 10px 4px}
.locked{box-shadow:var(--shadow)}
.mailbtn{box-shadow:var(--shadow)}
.badge{animation:badgepop .4s}
@keyframes badgepop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
/* 설정: 배경 색 */
:root[data-bg="mint"]{--bg:#e6f3ec;--dot:#c3dfcf}
:root[data-bg="peach"]{--bg:#fbede5;--dot:#efcfbe}
:root[data-bg="lavender"]{--bg:#eeedf8;--dot:#d2cfeb}
:root[data-bg="lemon"]{--bg:#f8f4dc;--dot:#e5dcaa}
@media (prefers-color-scheme:dark){
 :root[data-bg="mint"]:not([data-theme="light"]){--bg:#0e1a15;--dot:#1c2e26}
 :root[data-bg="peach"]:not([data-theme="light"]){--bg:#1c1512;--dot:#33261f}
 :root[data-bg="lavender"]:not([data-theme="light"]){--bg:#14131e;--dot:#26243c}
 :root[data-bg="lemon"]:not([data-theme="light"]){--bg:#1a1810;--dot:#2f2b1b}}
:root[data-bg="mint"][data-theme="dark"]{--bg:#0e1a15;--dot:#1c2e26}
:root[data-bg="peach"][data-theme="dark"]{--bg:#1c1512;--dot:#33261f}
:root[data-bg="lavender"][data-theme="dark"]{--bg:#14131e;--dot:#26243c}
:root[data-bg="lemon"][data-theme="dark"]{--bg:#1a1810;--dot:#2f2b1b}
/* 배경 색마다 이름표(포인트) 색도 같이 바뀜 */
:root{--strap:var(--accent)}
:root[data-bg="mint"]{--accent:#22795a;--accent-soft:#d3ede1}
:root[data-bg="peach"]{--accent:#b9532f;--accent-soft:#f7dccf}
:root[data-bg="lavender"]{--accent:#5a4ca6;--accent-soft:#e1ddf5}
:root[data-bg="lemon"]{--accent:#8a6400;--accent-soft:#f1e6b8}
@media (prefers-color-scheme:dark){
 :root[data-bg="mint"]:not([data-theme="light"]){--accent:#6fd1a5;--accent-soft:#183a2c;--accent-ink:#0b1a13}

const CODE_KEYS={hobbies:'h',games:'g',music:'m',media:'v',personality:'p'};
function cleanProfile(o){
  // 남이 준 값은 정해진 것만 받아요
  if(!o||typeof o!=='object') return null;
  const name=typeof o.name==='string'?o.name.trim().slice(0,12):'';
  const grade=GRADES[o.grade]?+o.grade:0;
  if(!name||!grade) return null;
  const p=blank(); p.name=name; p.grade=grade;
  p.gender=GENDERS[o.gender]?o.gender:''; p.birth=BIRTH_RE.test(String(o.birth||''))?o.birth:'';
  p.pub={gender:!!(o.pub&&o.pub.gender),birth:!!(o.pub&&o.pub.birth)};
  CATS.forEach(c=>{p[c.k]=(Array.isArray(o[c.k])?o[c.k]:[]).filter(v=>typeof v==='string'&&c.o[v]).filter((v,i,a)=>a.indexOf(v)===i);});
  return p;
}
const b64e=str=>{const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));};
function makeCode(p){
  const o={n:p.name,r:p.grade};
  CATS.forEach(c=>{const keys=Object.keys(c.o);let m=0;p[c.k].forEach(v=>{const i=keys.indexOf(v);if(i>=0)m|=1<<i;});o[CODE_KEYS[c.k]]=m.toString(36);});
  if(p.pub&&p.pub.gender&&GENDERS[p.gender]) o.x=p.gender;
  if(p.pub&&p.pub.birth&&BIRTH_RE.test(p.birth)) o.b=p.birth;
  return 'FM1-'+b64e(JSON.stringify(o));
}
function readCode(text){
  const m=String(text||'').replace(/\s+/g,'').match(/FM1-([A-Za-z0-9_-]{8,600})/);
  if(!m) return null;
  let o; try{o=JSON.parse(b64d(m[1]));}catch(_){return null;}
  if(!o||typeof o!=='object') return null;
  const raw={name:o.n,grade:o.r,gender:o.x,birth:o.b};
  CATS.forEach(c=>{const keys=Object.keys(c.o);const mask=parseInt(String(o[CODE_KEYS[c.k]]||'0'),36)||0;raw[c.k]=keys.filter((_,i)=>mask&(1<<i));});
  const p=cleanProfile(raw); if(!p) return null;
  p.code='FM1-'+m[1];
  return p;
}
function codeId(code){let h=0;for(const ch of code)h=(h*31+ch.charCodeAt(0))|0;return 'code-'+(h>>>0).toString(36);}

/* ===== 잠금 비밀번호 ===== */
// 비밀번호는 원래 글자 대신 PBKDF2로 바꾼 값만, 본인만 열 수 있는 비공개 공간에 저장해요
const autoKey=()=> 'fm_auto_'+uid;
const waitKey=()=> 'fm_wait_'+uid;
const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},key,256);
  return hex(bits);
}
function waitLeft(){const w=+(lsGet(waitKey())||0);return Math.max(0,Math.ceil((w-Date.now())/1000));}

      <form id="gateForm" novalidate>

        <label class="f">${t('pw2L')}<input type="password" id="pw2" autocomplete="new-password" maxlength="40"></label>
        <label class="check"><input type="checkbox" id="auto" checked>${t('autoL')}</label>

    inner=`<div class="qhead"><span class="qnum">!</span><div><h2>${t('forgotT')}</h2><p class="sub">${t('forgotN')}</p></div></div>
      <div class="btnrow" style="justify-content:flex-end"><button class="btn" id="fgCancel">${t('cancel')}</button><button class="btn dangerfill" id="fgYes" ${gateBusy?'disabled':''}>${t('startOver')}</button></div>`;
  }

  const f=$('#gateForm');
  if(f){ f.onsubmit=e=>{e.preventDefault(); gate==='set'?doSetPw():doUnlock();}; setTimeout(()=>{const p=$('#pw1'); if(p&&!p.disabled) p.focus();},50); }
  if($('#forgotB')) $('#forgotB').onclick=()=>{gate='forgot';gateMsg='';renderGate();};
  if($('#fgCancel')) $('#fgCancel').onclick=()=>{gate='unlock';renderGate();};
  if($('#fgYes')) $('#fgYes').onclick=doStartOver;
  if(gate==='unlock'&&waitLeft()){clearTimeout(renderGate.t);renderGate.t=setTimeout(()=>{if(gate==='unlock')renderGate();},1000);}

async function doSetPw(){
  const a=$('#pw1').value, b=$('#pw2').value, auto=$('#auto').checked;
  if(a.length<4){gateMsg=t('pwShort');return renderGate();}
  if(a!==b){gateMsg=t('pwMismatch');return renderGate();}
  gateBusy=true; gateMsg=''; renderGate();
  try{
    const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
    const hash=await hashPw(a,salt);
    await userCol().doc('lock').set({salt,hash,createdAt:Date.now()});
    lockDoc={salt,hash};
    auto?lsSet(autoKey(),'1'):lsDel(autoKey());
    gateBusy=false; gate=null; renderChrome(); render(); toast(t('pwSet'));
  }catch(e){ gateBusy=false; gateMsg=t('saveFail'); renderGate(); }
}
async function doUnlock(){
  if(waitLeft()) return renderGate();
  const a=$('#pw1').value, auto=$('#auto').checked;
  gateBusy=true; gateMsg=''; renderGate();
  let ok=false;
  try{ ok=(await hashPw(a,lockDoc.salt))===lockDoc.hash; }catch(_){}
  gateBusy=false;
  if(ok){
    wrong=0; lsDel(waitKey());
    auto?lsSet(autoKey(),'1'):lsDel(autoKey());
    gate=null; renderChrome(); render();
  }else{
    wrong++;
    if(wrong>=5){ wrong=0; lsSet(waitKey(),Date.now()+30000); gateMsg=''; }
    else gateMsg=t('wrongPw',{n:5-wrong});
    renderGate();
  }
}
async function doStartOver(){

  gateBusy=false; lockDoc=null; profile=null; me=blank(); view='quiz'; step=0;
  hiddenSet=new Set(); demoInbox=[]; lsDel(autoKey()); lsDel(waitKey());
  gate='set'; gateMsg=''; renderChrome(); render();
}

/* 생년월일: 사이트 언어에 맞춰 년·월·일을 따로 고르는 칸 */
const daysIn=(y,m)=>new Date(y||2012,m,0).getDate();
function birthParts(){const m=String(me.birth||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?{y:+m[1],m:+m[2],d:+m[3]}:(me._b||{y:0,m:0,d:0});}
function monthName(m){try{return new Intl.DateTimeFormat(LANG_CODES[L],{month:'long'}).format(new Date(2020,m-1,1));}catch(_){return String(m);}}
function dayName(d){return [d+'일',String(d),d+'日',String(d),String(d),d+'日'][L];}
function yearName(y){return [y+'년',String(y),y+'年',String(y),String(y),y+'年'][L];}
function birthSelects(){
  const b=birthParts(), ph=[['년','월','일'],['Year','Month','Day'],['年','月','日'],['Год','Месяц','День'],['Año','Mes','Día'],['年','月','日']][L];
  const ys=[];for(let y=2020;y>=2005;y--)ys.push(y);
  const nd=daysIn(b.y,b.m||1);
  return `<span class="bsel">
    <select id="by" aria-label="${ph[0]}"><option value="0">${ph[0]}</option>${ys.map(y=>`<option value="${y}"${y===b.y?' selected':''}>${yearName(y)}</option>`).join('')}</select>
    <select id="bm" aria-label="${ph[1]}"><option value="0">${ph[1]}</option>${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}"${m===b.m?' selected':''}>${esc(monthName(m))}</option>`).join('')}</select>
    <select id="bd" aria-label="${ph[2]}"><option value="0">${ph[2]}</option>${Array.from({length:nd},(_,i)=>i+1).map(d=>`<option value="${d}"${d===b.d?' selected':''}>${dayName(d)}</option>`).join('')}</select></span>`;
}
function onBirthChange(){
  const y=+$('#by').value,m=+$('#bm').value;let d=+$('#bd').value;
  const nd=daysIn(y,m||1); if(d>nd) d=nd;
  // 월을 바꾸면 그 달의 날짜 수에 맞게 일 목록을 다시 만들어요
  const cur=$('#bd').options.length-1;
  if(cur!==nd){$('#bd').innerHTML=`<option value="0">${$('#bd').options[0].text}</option>`+Array.from({length:nd},(_,i)=>i+1).map(x=>`<option value="${x}"${x===d?' selected':''}>${dayName(x)}</option>`).join('');}
  me._b={y,m,d};
  me.birth=(y&&m&&d)?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:'';
}

async function submit(){
  if(doneCount()<QN) return;
  me.name=me.name.trim();

    $('#submitB').disabled=true;

    const shared={...p,updatedAt:Date.now()}; delete shared.pub;

      await db.collection('profiles').doc(uid).set(shared);

  if(!db){ lsSet('fm_local_profile',JSON.stringify(p)); localProfile=true; }

}

/* ===== 추천 계산: 질문마다 겹친 비율의 평균 → 70% 이상만 추천 ===== */
function match(s){
  let sum=0;const shared=[];
  CATS.forEach(c=>{
    const a=(profile[c.k]||[]).filter(v=>v!=='none'), b=(Array.isArray(s[c.k])?s[c.k]:[]).filter(v=>v!=='none');
    const common=a.filter(x=>b.includes(x));
    if(a.length&&b.length) sum+=common.length/Math.min(a.length,b.length);
    common.forEach(v=>shared.push({k:c.k,v}));
  });
  let score=sum/CATS.length + (s.grade===profile.grade?0.05:0);
  return {pct:Math.min(99,Math.round(20+score*130)),shared};
}
const avc=n=>'av'+([...String(n||'')].reduce((a,c)=>a+c.codePointAt(0),0)%6);

  return `<div class="social">

      <button class="replybtn savebtn ${sv?'on':''}" data-save="${esc(s.id)}" aria-pressed="${sv}" aria-label="${t('saveL')}" title="${t('saveL')}">${SAVE_SVG}</button>
    </div>
    ${openReply===s.id?`<div class="presets">${Object.keys(PRESETS).map(k=>`<button class="${myRep&&myRep.q===k?'on':''}" data-preset="${k}" data-to="${esc(s.id)}">${PRESETS[k][L]}</button>`).join('')}</div>`:''}
    ${reps.length?`<div class="replies">${reps.map(x=>`<div>${x.isMe?`<b>${t('you')}</b>`:`<button class="namebtn" data-open="${esc(x.id)}">${esc(x.name)}</button>`}${PRESETS[x.replies[s.id].q][L]}</div>`).join('')}</div>`:''}`;
}
function cardHTML(s,m,opt={}){
  const st=m.shared.map(x=>TPL[x.k]?TPL[x.k][L](lab(x.k,x.v)):'').filter(Boolean); if(!st.length) st.push(t('defStarter'));
  const i=(starterIdx[s.id]||0)%st.length;
  const both=profile.hearts&&profile.hearts[s.id]&&theyHeartMe(s);
  return `<article class="card"><span class="hole"></span>
    <div class="top"><div class="avatar ${avc(s.name)}">${esc([...String(s.name||'?')][0])}</div>
      <div class="who"><div class="nm"><b>${esc(s.name)}</b><span class="gpill">${gl(s.grade)}</span></div>${metaParts(s)?`<span class="meta">${metaParts(s)}</span>`:''}${both?`<span class="mutual">♥ ${t('mutual')}</span>`:''}${s.example?`<span class="exb">${t('exBadge')}</span>`:''}${opt.code?`<span class="exb">${t('codeBadge')}</span>`:''}</div>
      <div class="meter"><div class="ring" style="--p:${m.pct}"><span>${m.pct}%</span></div><div class="lv">${level(m.pct)}</div></div></div>
    <div class="body">
      <div class="label">${t('shared',{n:m.shared.length})}</div>
      <div class="shared">${m.shared.map(x=>`<span class="stag">${esc(lab(x.k,x.v))}</span>`).join('')}</div>
      <div class="label">${t('starter')}</div>
      <div class="starter"><q>${esc(st[i])}</q>${st.length>1?`<button class="mini" data-next="${esc(s.id)}">${t('another')}</button>`:''}<button class="mini" data-copy>${t('copy')}</button></div>
      ${opt.code?`<div class="social"><span class="note" style="flex:1">${t('codeNoSocial')}</span><button class="btn danger" style="font-size:12px;padding:4px 10px" data-uncode="${esc(s.id)}">${t('codeRemove')}</button></div>`:socialHTML(s)}
    </div></article>`;
}

/* ===== 이름표 보기 창 / 확인 창 ===== */
function openModal(id){ if(!profile||view!=='result')return; confirmBox=null; modalId=id; renderModal(); }
function closeModal(){ modalId=null; confirmBox=null; const m=$('#modal'); if(m){m.hidden=true;m.innerHTML='';} }
function askConfirm(opts){ modalId=null; confirmBox=opts; renderModal(); }
function renderModal(){
  const box=$('#modal');
  if(confirmBox){
    box.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><div class="confirm"><h3>${confirmBox.title}</h3><p class="note">${confirmBox.note}</p>
      <div class="btnrow"><button class="btn" id="cfNo">${t('cancel')}</button><button class="btn dangerfill" id="cfYes">${confirmBox.yes}</button></div></div></div>`;
    box.hidden=false;
    $('#cfNo').onclick=closeModal;
    $('#cfYes').onclick=()=>{const f=confirmBox.onYes;closeModal();f();};
    $('#cfNo').focus();
    return;
  }
  const s=modalId&&findStudent(modalId);
  if(!s||hiddenSet.has(s.id)){closeModal();return;}
  box.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
      <div class="mtools"><button class="btn" id="mClose">${t('close')}</button><button class="btn danger" data-hidep="${esc(s.id)}">${t('hideP')}</button></div>
      ${cardHTML(s,match(s))}</div>`;
  box.hidden=false;
  $('#mClose').onclick=closeModal;
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

/* ===== 결과 화면 ===== */
function renderResult(){
  const p=profile;
  const got=inboxItems();
  const gotH=got.filter(x=>x.type==='heart').length, gotR=got.filter(x=>x.type==='reply'), gotS=got.filter(x=>x.type==='save');
  const mySaved=[...others,...EXAMPLES].filter(x=>p.saves&&p.saves[x.id]&&!hiddenSet.has(x.id));
  const hiddenList=[...hiddenSet].map(findStudent).filter(Boolean);
  const myChips=CATS.flatMap(c=>p[c.k].map(v=>`<span>${esc(lab(c.k,v))}</span>`)).join('');
  const vis=visibleOthers();
  const pool=[...vis,...(vis.length<3?EXAMPLES.filter(e=>!hiddenSet.has(e.id)):[])];
  const ranked=pool.map(s=>({s,m:match(s)})).filter(x=>x.m.pct>=70).sort((a,b)=>b.m.pct-a.m.pct);
  const recHTML = ranked.length ? `<div class="cards">${ranked.map(({s,m})=>cardHTML(s,m)).join('')}</div>`
    : `<div class="locked"><h3>${t('noneT')}</h3><p class="note">${t('noneN')}</p></div>`;
  $('#app').innerHTML=`<div class="grid">
    <div class="col"><section class="mytag lanyard"><div class="band"><span>${t('myTag')}</span><small>EOS</small></div><div class="inner">
      <div class="nm"><b>${esc(p.name)}</b><span class="gpill">${gl(p.grade)}</span></div>
      ${metaParts(p,true)?`<div class="meta">${metaParts(p,true)}</div>`:''}
      <div class="minichips">${myChips}</div>
      <div class="recv"><div class="label" style="color:var(--heart)">${t('received',{h:gotH,r:gotR.length})}</div>
        ${gotR.length?`<div class="replies">${gotR.map(x=>`<div><button class="namebtn" data-open="${esc(x.from.id)}">${esc(x.from.name)}</button>${PRESETS[x.q][L]}</div>`).join('')}</div>`:''}
        ${gotS.length?`<div class="label" style="color:var(--accent)">${t('savedMe',{n:gotS.length})}</div><div class="savedlist">${gotS.map(x=>`<button class="linkchip" data-open="${esc(x.from.id)}">${esc(x.from.name)}</button>`).join('')}</div>`:''}
        ${mySaved.length?`<div class="label">${t('mySaved')}</div><div class="savedlist">${mySaved.map(x=>`<button class="linkchip" data-open="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div>`:''}
        ${hiddenList.length?`<div class="unhide">${t('hiddenL')} ${hiddenList.map(x=>`<span>${esc(x.name)}</span><button class="mini" data-unhide="${esc(x.id)}">${t('unhide')}</button>`).join(' ')}</div>`:''}</div>
      <div class="codebox"><div class="label">${t('myCodeT')}</div><code id="myCode">${esc(makeCode(p))}</code>
        <button class="btn" id="copyCodeB">${t('copyCode')}</button><p class="note">${t('myCodeN')}</p></div>
      <div class="btnrow"><button class="btn" id="editB">${t('edit')}</button>${db?`<button class="btn" id="lockB">🔒 ${t('lockB')}</button><button class="btn danger" id="removeB">${t('remove')}</button>`:''}</div>
    </div></section></div>
    <div class="col">
      <div><div class="label">${t('participants',{n:vis.length+1})}</div><h2 class="sec">${esc(t('recTitle',{n:p.name}))}</h2></div>
      ${recHTML}
      <section class="codesec">
        <div><div class="label">${t('codeFriendsT')}</div><h2 class="sec">${t('addCodeT')}</h2><p class="note">${t('addCodeN')}</p></div>
        <form class="addcode" id="codeForm"><input type="text" id="codeIn" placeholder="${esc(t('addCodePh'))}" autocomplete="off" spellcheck="false"><button class="btn primary" type="submit">${t('addB')}</button></form>
        <p class="err" role="alert">${esc(codeMsg)}</p>
        ${codeFriends.length?`<div class="cards">${codeFriends.map(f=>({s:f,m:match(f)})).sort((a,b)=>b.m.pct-a.m.pct).map(({s,m})=>cardHTML(s,m,{code:true})).join('')}</div>`:`<p class="note">${t('codeEmpty')}</p>`}
      </section>
    </div></div>`;
  $('#editB').onclick=()=>{view='quiz';step=0;me=JSON.parse(JSON.stringify(profile));renderQuiz();window.scrollTo({top:0});};
  $('#lockB')&&($('#lockB').onclick=lockNow);
  $('#copyCodeB').onclick=()=>{
    const msg=t('shareMsg')+'\n'+makeCode(profile);
    try{navigator.clipboard.writeText(msg).then(()=>toast(t('copied')),()=>{selectCode();toast(t('copyFail'));});}catch(_){selectCode();toast(t('copyFail'));}
  };
  $('#codeForm').onsubmit=e=>{e.preventDefault();addCode($('#codeIn').value);};
  $('#removeB')&&($('#removeB').onclick=()=>askConfirm({title:t('removeQ'),note:t('removeN'),yes:t('removeYes'),onYes:async()=>{
    try{await Promise.all([db.collection('profiles').doc(uid).delete(),userCol().doc('private').delete()]);}catch(_){toast(t('saveFail'));return;}
    profile=null;me=blank();view='quiz';step=0;demoInbox=[];render();renderBadge();toast(t('removed'));}}));
  if(modalId) renderModal();
}
function selectCode(){const el=$('#myCode');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}
function addCode(text){
  const f=readCode(text);
  if(!f){codeMsg=t('badCode');renderResult();return;}
  if(f.code===makeCode(profile)){codeMsg=t('selfCode');renderResult();return;}
  const id=codeId(f.name+f.grade), old=codeFriends.findIndex(x=>x.id===id);
  const entry={...f,id,codeFriend:true};
  if(old>=0){codeFriends[old]=entry;toast(t('codeUpdated',{n:f.name}));}else{codeFriends.push(entry);toast(t('codeAdded',{n:f.name}));}
  codeMsg=''; saveCodeFriends(); renderResult();
  const sec=document.querySelector('.codesec'); if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'});
}
document.addEventListener('click',e=>{
  if(view!=='result'||gate)return;
  const b=e.target.closest('button'); if(!b||!b.isConnected)return;
  if(b.closest('#inbox')||b.closest('#settings'))return;
  if(b.dataset.uncode){codeFriends=codeFriends.filter(x=>x.id!==b.dataset.uncode);saveCodeFriends();renderResult();return;}
  if(b.dataset.open){openModal(b.dataset.open);return;}
  if(b.dataset.hidep){hideStudent(b.dataset.hidep);return;}
  if(b.dataset.unhide){unhideStudent(b.dataset.unhide);return;}
  if(b.dataset.heart){const s=findStudent(b.dataset.heart);if(s)toggleHeart(s);return;}
  if(b.dataset.save){const s=findStudent(b.dataset.save);if(s)toggleSave(s);return;}
  if(b.dataset.reply){openReply=openReply===b.dataset.reply?null:b.dataset.reply;renderResult();return;}
  if(b.dataset.preset){const s=findStudent(b.dataset.to);if(s)setReply(s,b.dataset.preset);return;}
  if(b.dataset.next){starterIdx[b.dataset.next]=(starterIdx[b.dataset.next]||0)+1;renderResult();return;}
  if(b.hasAttribute('data-copy')){const q=b.parentElement.querySelector('q').textContent;
    try{navigator.clipboard.writeText(q).then(()=>toast(t('copied')),()=>toast(t('copyFail')));}catch(_){toast(t('copyFail'));}}
});

/* ===== 공유 저장소 (Claude에 로그인한 사람만) ===== */
const getDoc=async ref=>{try{const s=await ref.get();return s.exists?s.data():null;}catch(_){return null;}};
async function connect(){
  try{
    const [d,u]=await Promise.all([window.claude?.use('db'),window.claude?.use('user')]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; uid=id;
    if(localProfile){ profile=null; me=blank(); view='quiz'; step=0; localProfile=false; }
    const [inb,priv,lk,prefs]=await Promise.all(['inbox','private','lock','prefs'].map(k=>getDoc(userCol().doc(k))));
    if(inb) seenAt=Math.max(seenAt,+inb.seenAt||0);
    const privateInfo=priv?{gender:GENDERS[priv.gender]?priv.gender:'',birth:BIRTH_RE.test(priv.birth||'')?priv.birth:'',pub:{gender:!!(priv.pub&&priv.pub.gender),birth:!!(priv.pub&&priv.pub.birth)}}:null;
    if(prefs&&Array.isArray(prefs.hidden)) hiddenSet=new Set(prefs.hidden.map(String));
    if(lk&&lk.salt&&lk.hash){ lockDoc={salt:lk.salt,hash:lk.hash}; gate=lsGet(autoKey())==='1'?null:'unlock'; }
    else gate='set';
    renderChrome(); render();
    let first=true;
    db.collection('profiles').onSnapshot(snap=>{
      others=[];
      snap.docs.forEach(doc=>{
        const v=doc.data(); if(!v||typeof v.name!=='string'||!v.name) return;
        if(doc.id===uid){
          if(first&&!profile){
            profile=Object.assign(blank(),JSON.parse(JSON.stringify(v)),privateInfo||{}); delete profile.updatedAt;
            me=JSON.parse(JSON.stringify(profile)); view='result';
            if(!gate) render();
          }
        }else others.push({...v,name:v.name.slice(0,12),id:doc.id});
      });
      first=false; renderBadge(); if(!$('#inbox').hidden) renderInbox();
      if(view==='result'&&!gate) renderResult();
    },()=>{});
  }catch(_){}
}

try{const lp=cleanProfile(JSON.parse(lsGet('fm_local_profile')||'null'));if(lp){profile=lp;me=JSON.parse(JSON.stringify(lp));view='result';localProfile=true;}}catch(_){}
renderChrome(); render(); connect();

</script>
